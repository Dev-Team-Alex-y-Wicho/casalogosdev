name: Generate Chalupas Web Clip RGB assets

on:
  push:
    branches:
      - fix/chalupas-ios-webclip-v2
    paths:
      - '.github/workflows/chalupas-webclip-rgb-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/chalupas-ios-webclip-v2

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate opaque RGB icons with versioned filenames
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('demos/chalupas-pos-pwa')
          src = root / 'apple-touch-icon.png'
          with Image.open(src) as im:
              base = im.convert('RGB')
              outputs = {
                  'apple-touch-icon-v2-152.png': (152, 152),
                  'apple-touch-icon-v2-180.png': (180, 180),
                  'icon-v2-192.png': (192, 192),
                  'icon-v2-512.png': (512, 512),
              }
              for name, size in outputs.items():
                  out = base.resize(size, Image.Resampling.LANCZOS)
                  out.save(root / name, format='PNG', optimize=True)
          PY

      - name: Verify PNG mode and dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('demos/chalupas-pos-pwa')
          expected = {
              'apple-touch-icon-v2-152.png': (152, 152),
              'apple-touch-icon-v2-180.png': (180, 180),
              'icon-v2-192.png': (192, 192),
              'icon-v2-512.png': (512, 512),
          }
          for name, size in expected.items():
              with Image.open(root / name) as im:
                  assert im.size == size, (name, im.size, size)
                  assert im.mode == 'RGB', (name, im.mode)
                  assert 'transparency' not in im.info, (name, im.info)
                  print(f'{name}: {im.size[0]}x{im.size[1]} mode={im.mode}')
          PY

      - name: Commit generated assets to QA branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demos/chalupas-pos-pwa/apple-touch-icon-v2-152.png \
                  demos/chalupas-pos-pwa/apple-touch-icon-v2-180.png \
                  demos/chalupas-pos-pwa/icon-v2-192.png \
                  demos/chalupas-pos-pwa/icon-v2-512.png
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add opaque RGB icons for iPad web clip'
          git push origin HEAD:fix/chalupas-ios-webclip-v2
